name: Repository role boundary

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-role-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Open and official distribution isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run repository role contract and negative fixtures
        run: scripts/test-public-delivery-boundary.sh
